<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <main>
      <h1>QuickNotes (API Version)</h1>

      <button id="load-btn">Load notes</button>
      <p id="status"></p>

      <section class="form-section">
        <h2>Create a Note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="title-input">Title (required, max 100 chars):</label>
            <input type="text" id="title-input" placeholder="Note title..." />
          </div>
          <div class="form-group">
            <label for="body-input">Body (optional):</label>
            <textarea
              id="body-input"
              rows="4"
              placeholder="Note body..."
            ></textarea>
          </div>
          <button type="submit" id="submit-btn">Create Note</button>
        </form>
      </section>

      <ul id="notes-list"></ul>
    </main>
  </body>
</html>
